name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-a:
    runs-on: [self-hosted, linux, x64, personal-gha-tui-probe]
    timeout-minutes: 6
    steps:
      - name: Observe probe window
        run: |
          printf 'probe start\n'
          date -u
          uname -s -m
          test -S /var/run/docker.sock
          sleep 300
          printf 'probe end\n'
          date -u
