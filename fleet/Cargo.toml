[package]
name = "gha-fleet"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gha_fleet"
path = "src/lib.rs"

[[bin]]
name = "gha-fleet"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true
panic = "abort"
